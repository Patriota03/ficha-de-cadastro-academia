<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de Cadastro - Academia Performance</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a15 0%, #0d0d20 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            background: #16162a;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            overflow: hidden;
            z-index: 2;
        }

        .page-wrapper {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            max-width: 1500px;
            margin: 0 auto;
        }

        .side-image {
            flex: 1;
            min-height: 150vh;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            position: sticky;
            top: 20px;
            align-self: flex-start;
        }

        .side-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .header {
            position: relative;
            background: url('https://i.pinimg.com/736x/ce/b0/70/ceb070f432055e52f93170f63ff692c8.jpg') no-repeat center bottom;
            background-size: cover;
            color: white;
            padding: 30px;
            text-align: center;
            overflow: hidden;
            min-height: 220px;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.4) 100%);
            z-index: 1;
        }

        .header > * { position: relative; z-index: 2; }

        .header-title-svg {
            width: 100%;
            max-width: 600px;
            height: 60px;
            margin: 0 auto;
            display: block;
        }

        .header-curved-text {
            font-size: 40px;
            font-weight: 900;
            fill: #2ecc71;
            text-transform: uppercase;
            letter-spacing: 4px;
            paint-order: stroke fill;
            stroke: rgba(0,0,0,0.8);
            stroke-width: 2px;
            filter: drop-shadow(0 2px 6px rgba(46,204,113,0.5));
        }
        .header .subtitle { font-size: 1em; opacity: 0.9; font-weight: 300; text-shadow: 0 1px 4px rgba(0,0,0,0.8); margin-top: 10px; }
        .header .logo-icon { font-size: 3em; margin-bottom: 10px; }
        .sync-badge { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); font-size: 0.7em; color: #2ecc71; letter-spacing: 1px; text-shadow: 0 1px 4px rgba(0,0,0,0.8); opacity: 0.9; white-space: nowrap; }
        .sync-badge-form { font-size: 0.75em; color: #2ecc71; text-align: center; margin-bottom: 5px; letter-spacing: 1px; }
        .backup-section { display: flex; justify-content: center; gap: 10px; margin-bottom: 10px; padding-top: 10px; border-top: 1px solid #2a2a3a; }

        /* NAV TABS */
        .nav-tabs {
            display: flex;
            background: #1a1a2e;
            border-bottom: 3px solid #e94560;
        }

        .nav-tab {
            flex: 1;
            padding: 14px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95em;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background 0.3s, color 0.3s;
            border: none;
            background: transparent;
            color: #888;
        }

        .nav-tab:hover { background: #2a2a3a; color: #ccc; }
        .nav-tab.active { background: #e94560; color: white; }
        .nav-tab.vencidas { color: #e94560; }
        .nav-tab.vencidas:hover { background: #2a1520; }

        .tab-content { display: none; padding: 30px 40px; }
        .tab-content.active { display: block; }
        #aba-lista { background: #12121c; }

        .section-title {
            font-size: 1.1em;
            font-weight: 600;
            color: #e94560;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 25px 0 15px 0;
            padding-bottom: 8px;
            border-bottom: 2px solid #e94560;
        }

        .modal-body .section-title { color: #e94560; }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .form-row.single { grid-template-columns: 1fr; }
        .form-row.triple { grid-template-columns: 1fr 1fr 1fr; }

        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-size: 0.85em; font-weight: 600; color: #ccc; margin-bottom: 5px; }

        .form-group input, .form-group select, .form-group textarea {
            padding: 10px 12px;
            border: 2px solid #2a2a3a;
            border-radius: 6px;
            font-size: 0.95em;
            transition: border-color 0.3s, box-shadow 0.3s;
            font-family: inherit;
            background: #1a1a2e;
            color: #f0f0f0;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: #e94560;
            box-shadow: 0 0 0 3px rgba(233,69,96,0.15);
        }

        .form-group input::placeholder, .form-group textarea::placeholder { color: #555; }

        .form-group textarea { resize: vertical; min-height: 60px; }

        .checkbox-group { display: flex; flex-wrap: wrap; gap: 15px; margin-top: 5px; }
        .checkbox-group label { display: flex; align-items: center; gap: 6px; font-weight: 400; cursor: pointer; color: #ccc; }
        .checkbox-group input[type="checkbox"] { width: 16px; height: 16px; accent-color: #e94560; }

        .btn-group { display: flex; justify-content: center; gap: 15px; margin: 30px 0; }

        .btn {
            padding: 12px 35px;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(0,0,0,0.2); }
        .btn-primary { background: linear-gradient(135deg, #e94560, #c23152); color: white; }
        .btn-secondary { background: #2a2a3a; color: #ccc; }
        .btn-print { background: linear-gradient(135deg, #0f3460, #16213e); color: white; }
        .btn-danger { background: linear-gradient(135deg, #c0392b, #962d22); color: white; }
        .btn-success { background: linear-gradient(135deg, #27ae60, #1e8449); color: white; padding: 6px 10px; border: none; border-radius: 4px; cursor: pointer; font-size: 0.8em; }
        .btn-success:hover { opacity: 0.8; }

        .observacoes {
            background: #1a1a2e;
            border: 2px dashed #2a2a3a;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
        }

        .assinatura-area { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-top: 30px; padding-top: 20px; }
        .assinatura-box { text-align: center; border-top: 2px solid #aaa; padding-top: 10px; }
        .assinatura-box p { font-weight: 600; font-size: 0.85em; color: #ccc; }
        .assinatura-box .line { height: 1px; margin-top: 40px; }
        .assinatura-box .line2 { font-size: 0.75em; color: #888; margin-top: 5px; }

        /* LISTAGEM */
        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-bar input {
            flex: 1;
            min-width: 200px;
            padding: 12px 15px;
            border: 2px solid #2a2a3a;
            border-radius: 6px;
            font-size: 1em;
            background: #1e1e2f;
            color: #f0f0f0;
        }

        .search-bar input:focus { outline: none; border-color: #e94560; }
        .search-bar input::placeholder { color: #666; }

        .stats {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .stat-card {
            flex: 1;
            min-width: 140px;
            background: linear-gradient(135deg, #1a1a2e, #0f0f1a);
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #2a2a3a;
        }

        .stat-card .stat-num { font-size: 1.6em; font-weight: 700; }
        .stat-card .stat-label { font-size: 0.7em; opacity: 0.7; text-transform: uppercase; letter-spacing: 1px; }

        .aluno-list { list-style: none; }

        .aluno-item {
            display: grid;
            grid-template-columns: auto 1fr auto auto;
            align-items: center;
            gap: 15px;
            padding: 15px 20px;
            background: #1e1e2f;
            border: 1px solid #2a2a3a;
            border-left: 4px solid #e94560;
            border-radius: 6px;
            margin-bottom: 8px;
            transition: background 0.2s;
        }

        .aluno-item:hover { background: #2a2a3f; }

        .aluno-letra {
            width: 40px;
            height: 40px;
            background: #e94560;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.1em;
        }

        .aluno-info h4 { font-size: 1em; color: #f0f0f0; margin-bottom: 2px; }
        .aluno-info p { font-size: 0.8em; color: #888; }

        .aluno-plano {
            padding: 4px 12px;
            background: #e94560;
            color: white;
            border-radius: 20px;
            font-size: 0.75em;
            font-weight: 600;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .status-vencido {
            display: inline-block;
            margin-left: 6px;
            padding: 2px 8px;
            background: #c0392b;
            color: white;
            border-radius: 12px;
            font-size: 0.65em;
            text-transform: uppercase;
            vertical-align: middle;
        }

        .aluno-item.vencido { border-left-color: #c0392b; }

        .aluno-actions { display: flex; gap: 5px; }
        .aluno-actions button {
            padding: 6px 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8em;
            transition: opacity 0.2s;
        }

        .aluno-actions button:hover { opacity: 0.8; }
        .btn-view { background: #0f3460; color: white; }
        .btn-edit { background: #27ae60; color: white; }
        .btn-delete { background: #c0392b; color: white; }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #555;
        }

        .empty-state .icon { font-size: 4em; margin-bottom: 15px; }
        .empty-state h3 { color: #777; margin-bottom: 5px; }

        /* MODAL */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active { display: flex; }

        .modal {
            background: #1e1e2f;
            border-radius: 12px;
            max-width: 700px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            color: #f0f0f0;
        }

        .modal-header {
            background: linear-gradient(135deg, #e94560, #c23152);
            color: white;
            padding: 20px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 12px 12px 0 0;
        }

        .modal-header h2 { font-size: 1.3em; }

        .modal-close {
            background: none;
            border: none;
            color: white;
            font-size: 1.5em;
            cursor: pointer;
            padding: 0 5px;
        }

        .modal-body { padding: 25px; }

        .detail-row {
            display: grid;
            grid-template-columns: 180px 1fr;
            gap: 8px;
            padding: 8px 0;
            border-bottom: 1px solid #2a2a3a;
        }

        .detail-label { font-weight: 600; color: #aaa; font-size: 0.9em; }
        .detail-value { color: #f0f0f0; font-size: 0.9em; }

        .modal-footer {
            padding: 15px 25px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            border-top: 1px solid #2a2a3a;
        }

        .footer {
            background: #0a0a15;
            color: #555;
            text-align: center;
            padding: 15px;
            font-size: 0.8em;
        }

        @media print {
            body { background: white; padding: 0; }
            .container { box-shadow: none; border-radius: 0; background: white; }
            .btn-group, .nav-tabs { display: none; }
            .tab-content { display: block !important; padding: 20px; background: white; }
            .aluno-item { background: white; border: 1px solid #ddd; color: black; }
            .aluno-info h4 { color: black; }
            .aluno-info p { color: #555; }
            .aluno-plano { color: white; }
            .search-bar { display: none; }
            #aba-lista { background: white; }
            .header { background: #0a0a0a !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }

        @media (max-width: 900px) {
            .page-wrapper { flex-direction: column; }
            .side-image { display: none; }
            .container { max-width: 100%; border-radius: 0; }
            .nav-tabs { flex-wrap: wrap; }
            .nav-tab { font-size: 0.75em; padding: 12px 8px; letter-spacing: 0; }
        }

        @media (max-width: 600px) {
            body { padding: 0; }
            .form-row, .form-row.triple { grid-template-columns: 1fr; }
            .assinatura-area { grid-template-columns: 1fr; gap: 20px; }
            .header-curved-text { font-size: 22px; }
            .header { padding: 20px 15px; min-height: 160px; }
            .tab-content { padding: 15px; }
            .nav-tab { font-size: 0.7em; padding: 10px 6px; }
            .section-title { font-size: 0.95em; }
            .form-group input, .form-group select, .form-group textarea { padding: 12px; font-size: 16px; }
            .aluno-item { grid-template-columns: 1fr; gap: 8px; padding: 12px; }
            .aluno-letra { display: none; }
            .aluno-info p { font-size: 0.75em; line-height: 1.4; }
            .aluno-actions { width: 100%; justify-content: flex-end; }
            .aluno-actions button { padding: 8px 12px; font-size: 0.85em; }
            .detail-row { grid-template-columns: 1fr; gap: 4px; }
            .detail-label { margin-bottom: 2px; }
            .modal { margin: 10px; max-height: 90vh; border-radius: 10px; }
            .modal-header { padding: 15px; }
            .modal-header h2 { font-size: 1.1em; }
            .modal-body { padding: 15px; }
            .modal-footer { flex-direction: column; }
            .modal-footer .btn { width: 100%; padding: 12px; }
            .search-bar input { min-width: 0; font-size: 0.95em; }
            .stats { gap: 8px; }
            .stat-card { min-width: 45%; padding: 12px; }
            .stat-card .stat-num { font-size: 1.3em; }
            .stat-card .stat-label { font-size: 0.65em; }
            .btn { padding: 10px 20px; font-size: 0.9em; }
            .btn-group { gap: 10px; }
            .checkbox-group { gap: 10px; }
            .checkbox-group label { font-size: 0.9em; }
        }
    </style>
</head>
<body>

<div class="page-wrapper">
    <div class="side-image">
        <img src="https://i.pinimg.com/736x/56/57/46/5657460d80c3a02a0f12ec49a69829e8.jpg" alt="Arnold">
        <img src="https://i.pinimg.com/736x/45/38/31/453831720efc9ed55ac11b2781cf3fe4.jpg" alt="Muscular Reference">
    </div>
    <div class="container">
    <div class="header">
        <svg class="header-title-svg" viewBox="0 0 850 80" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <path id="curve" d="M 30,65 Q 425,5 820,65" fill="transparent"/>
            </defs>
            <text>
                <textPath href="#curve" startOffset="50%" text-anchor="middle" class="header-curved-text">Academia Performance</textPath>
            </text>
        </svg>
    </div>

    <div class="nav-tabs">
        <button class="nav-tab active" onclick="abrirAba('cadastro', this)">+ Novo Cadastro</button>
        <button class="nav-tab" onclick="abrirAba('lista', this)">Alunos Cadastrados</button>
        <button class="nav-tab vencidas" onclick="abrirAba('pendentes', this)">&#9888; Mensalidades Vencidas</button>
    </div>

    <!-- ABA CADASTRO -->
    <div class="tab-content active" id="aba-cadastro">
        <form id="fichaCadastro">
            <p class="sync-badge-form">✔ Sincronizado com GitHub - Patriota03</p>
            <h3 class="section-title">&#128100; Dados Pessoais</h3>

            <div class="form-row single">
                <div class="form-group">
                    <label>Nome Completo do Aluno</label>
                    <input type="text" id="nome" placeholder="Digite o nome completo">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Data de Nascimento</label>
                    <input type="text" id="nascimento" placeholder="dd/mm/aa" maxlength="8">
                </div>
                <div class="form-group">
                    <label>Sexo</label>
                    <select id="sexo">
                        <option value="">Selecione</option>
                        <option value="Masculino">Masculino</option>
                        <option value="Feminino">Feminino</option>
                        <option value="Outro">Outro</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Telefone / WhatsApp</label>
                    <input type="tel" id="telefone" placeholder="(00) 00000-0000">
                </div>
                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" id="email" placeholder="email@exemplo.com">
                </div>
            </div>

            <h3 class="section-title">&#127891; Dados da Matrícula</h3>

            <div class="form-row">
                <div class="form-group">
                    <label>Nº da Matrícula</label>
                    <input type="text" id="matricula" placeholder="00000">
                </div>
                <div class="form-group">
                    <label>Data da Matrícula</label>
                    <input type="date" id="dataMatricula">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Plano de Mensalidade</label>
                    <select id="plano">
                        <option value="">Selecione o plano</option>
                        <option value="Mensal">Mensal</option>
                        <option value="2 Meses">2 Meses</option>
                        <option value="3 Meses">3 Meses</option>
                        <option value="6 Meses">6 Meses</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Valor da Mensalidade (R$)</label>
                    <input type="number" id="valor" step="0.01" min="0" placeholder="0,00">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Dia de Vencimento</label>
                    <input type="date" id="vencimento">
                </div>
                <div class="form-group">
                    <label>Forma de Pagamento</label>
                    <select id="pagamento">
                        <option value="">Selecione</option>
                        <option value="Dinheiro">Dinheiro</option>
                        <option value="PIX">PIX</option>
                        <option value="Debito">Cartão de Débito</option>
                        <option value="Credito">Cartão de Crédito</option>
                        <option value="Boleto">Boleto Bancário</option>
                        <option value="Debito Automatico">Débito Automático</option>
                    </select>
                </div>
            </div>

            <h3 class="section-title">&#128207; Medidas Corporais</h3>

            <div class="form-row triple">
                <div class="form-group">
                    <label>Peso (kg)</label>
                    <input type="number" id="peso" step="0.1" min="0" placeholder="0,0">
                </div>
                <div class="form-group">
                    <label>Altura (cm)</label>
                    <input type="number" id="altura" step="0.1" min="0" placeholder="0,0">
                </div>
                <div class="form-group">
                    <label>Busto (cm)</label>
                    <input type="number" id="busto" step="0.1" min="0" placeholder="0,0">
                </div>
            </div>

            <div class="form-row triple">
                <div class="form-group">
                    <label>Cintura (cm)</label>
                    <input type="number" id="cintura" step="0.1" min="0" placeholder="0,0">
                </div>
                <div class="form-group">
                    <label>Quadril (cm)</label>
                    <input type="number" id="quadril" step="0.1" min="0" placeholder="0,0">
                </div>
                <div class="form-group">
                    <label>Braço D (cm)</label>
                    <input type="number" id="bracoD" step="0.1" min="0" placeholder="0,0">
                </div>
            </div>

            <div class="form-row triple">
                <div class="form-group">
                    <label>Braço E (cm)</label>
                    <input type="number" id="bracoE" step="0.1" min="0" placeholder="0,0">
                </div>
                <div class="form-group">
                    <label>Coxa D (cm)</label>
                    <input type="number" id="coxaD" step="0.1" min="0" placeholder="0,0">
                </div>
                <div class="form-group">
                    <label>Coxa E (cm)</label>
                    <input type="number" id="coxaE" step="0.1" min="0" placeholder="0,0">
                </div>
            </div>

            <div class="form-row triple">
                <div class="form-group">
                    <label>Panturrilha D (cm)</label>
                    <input type="number" id="panturrilhaD" step="0.1" min="0" placeholder="0,0">
                </div>
                <div class="form-group">
                    <label>Panturrilha E (cm)</label>
                    <input type="number" id="panturrilhaE" step="0.1" min="0" placeholder="0,0">
                </div>
                <div class="form-group">
                    <label>Abdômen (cm)</label>
                    <input type="number" id="abdomen" step="0.1" min="0" placeholder="0,0">
                </div>
            </div>

            <div class="btn-group">
                <button type="button" class="btn btn-primary" id="btnSalvar" onclick="salvarCadastro()">&#128190; Salvar Cadastro</button>
                <button type="reset" class="btn btn-secondary" onclick="limparFormulario()">Limpar</button>
            </div>

        </form>
    </div>

    <!-- ABA LISTA -->
    <div class="tab-content" id="aba-lista">
        <div class="stats" id="statsArea"></div>

        <div class="search-bar">
            <input type="text" id="buscaAluno" placeholder="Buscar aluno por nome..." oninput="renderizarLista()">
        </div>

        <ul class="aluno-list" id="alunoList"></ul>
    </div>

    <!-- ABA MENSALIDADES VENCIDAS -->
    <div class="tab-content" id="aba-pendentes">
        <div class="stats" id="statsPendentes"></div>

        <div class="search-bar">
            <input type="text" id="buscaPendente" placeholder="Buscar aluno com mensalidade vencida..." oninput="renderizarPendentes()">
        </div>

        <ul class="aluno-list" id="pendenteList"></ul>
    </div>

    <div class="footer">
        <div class="backup-section">
            <button type="button" class="btn btn-print" onclick="fazerBackup()">&#128190; Fazer Backup (JSON)</button>
            <button type="button" class="btn btn-secondary" onclick="restaurarBackup()">&#128194; Restaurar Backup</button>
            <input type="file" id="inputBackup" accept=".json" style="display:none" onchange="importarBackup(event)">
        </div>
        <p>&copy; 2026 Academia Performance - Todos os direitos reservados</p>
    </div>
</div>
    <div class="side-image">
        <img src="https://i.pinimg.com/736x/56/57/46/5657460d80c3a02a0f12ec49a69829e8.jpg" alt="Arnold">
        <img src="https://i.pinimg.com/736x/45/38/31/453831720efc9ed55ac11b2781cf3fe4.jpg" alt="Muscular Reference">
    </div>
</div>

<!-- MODAL DETALHES -->
<div class="modal-overlay" id="modalOverlay" onclick="fecharModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header">
            <h2 id="modalTitle">Detalhes do Aluno</h2>
            <button class="modal-close" onclick="fecharModal()">&times;</button>
        </div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-footer">
            <button class="btn btn-success" id="btnPagar" onclick="marcarComoPago()">&#10004; Marcar como Pago</button>
            <button class="btn btn-print" onclick="imprimirFicha()">Imprimir</button>
            <button class="btn btn-secondary" onclick="fecharModal()">Fechar</button>
        </div>
    </div>
</div>

<script>
    const DB_KEY = 'cadastrosPerformance';
    let editandoId = null;
    let alunoAtual = null;

    // ---- BANCO DE DADOS ----
    function carregarCadastros() {
        return JSON.parse(localStorage.getItem(DB_KEY) || '[]');
    }

    function salvarNoBanco(cadastros) {
        localStorage.setItem(DB_KEY, JSON.stringify(cadastros));
    }

    function buscarPorId(id) {
        return carregarCadastros().find(c => c.id === id);
    }

    function ordenarPorNome(cadastros) {
        return cadastros.sort((a, b) =>
            a.dadosPessoais.nome.localeCompare(b.dadosPessoais.nome, 'pt-BR')
        );
    }

    // ---- ABAS ----
    function abrirAba(aba, botao) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
        document.getElementById('aba-' + aba).classList.add('active');
        if (botao) botao.classList.add('active');
        if (aba === 'lista') renderizarLista();
        if (aba === 'pendentes') renderizarPendentes();
    }

    // ---- FORMATAÇÃO ----
    function formatarTelefone(input) {
        let v = input.value.replace(/\D/g, '');
        if (v.length > 11) v = v.slice(0, 11);
        if (v.length > 6) {
            v = '(' + v.slice(0,2) + ') ' + v.slice(2,7) + '-' + v.slice(7);
        } else if (v.length > 2) {
            v = '(' + v.slice(0,2) + ') ' + v.slice(2);
        } else if (v.length > 0) {
            v = '(' + v;
        }
        input.value = v;
    }

    document.getElementById('telefone').addEventListener('input', function() { formatarTelefone(this); });

    function mascararData(input) {
        let v = input.value.replace(/\D/g, '');
        if (v.length > 8) v = v.slice(0, 8);
        if (v.length > 4) {
            v = v.slice(0, 2) + '/' + v.slice(2, 4) + '/' + v.slice(4);
        } else if (v.length > 2) {
            v = v.slice(0, 2) + '/' + v.slice(2);
        }
        input.value = v;
    }

    document.getElementById('nascimento').addEventListener('input', function() { mascararData(this); });

    function preencherVencimento() {
        const dataMatricula = document.getElementById('dataMatricula');
        const vencimento = document.getElementById('vencimento');
        if (dataMatricula.value && !vencimento.value) {
            vencimento.value = dataMatricula.value;
        }
    }

    function dataAtualISO() {
        const hoje = new Date();
        const ano = hoje.getFullYear();
        const mes = String(hoje.getMonth() + 1).padStart(2, '0');
        const dia = String(hoje.getDate()).padStart(2, '0');
        return ano + '-' + mes + '-' + dia;
    }

    function converterData(valor) {
        if (!valor) return null;
        if (valor.includes('/')) {
            const partes = valor.split('/');
            if (partes.length !== 3) return null;
            let ano = parseInt(partes[2], 10);
            if (ano < 100) {
                ano = ano >= 70 ? 1900 + ano : 2000 + ano;
            }
            const mes = parseInt(partes[1], 10) - 1;
            const dia = parseInt(partes[0], 10);
            return new Date(ano, mes, dia);
        }
        if (valor.includes('-')) {
            const [a, m, d] = valor.split('-');
            return new Date(Number(a), Number(m) - 1, Number(d));
        }
        return null;
    }

    function ISOparaDataBR(iso) {
        if (!iso) return '';
        if (iso.includes('/')) {
            return iso.length >= 8 ? iso : '';
        }
        const [a, m, d] = iso.split('-');
        if (!a || !m || !d) return '';
        return d + '/' + m + '/' + a.slice(-2);
    }

    document.getElementById('dataMatricula').addEventListener('input', preencherVencimento);
    document.getElementById('dataMatricula').addEventListener('change', preencherVencimento);

    function formatarDataBR(dataISO) {
        if (!dataISO) return '-';
        if (dataISO.includes('/')) {
            return dataISO.length >= 8 ? dataISO : '-';
        }
        const [a, m, d] = dataISO.split('-');
        if (!a || !m || !d) return '-';
        const ano2 = a.slice(-2);
        return d + '/' + m + '/' + ano2;
    }

    function formatarValor(valor) {
        const n = Number(valor);
        return (isNaN(n) ? 0 : n).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function verificarVencimento(cadastro) {
        const vencRaw = cadastro.dadosMatricula.vencimento;
        if (!vencRaw) return false;

        const hoje = new Date();
        hoje.setHours(0, 0, 0, 0);

        const venc = converterData(vencRaw);
        if (!venc) return false;
        venc.setHours(0, 0, 0, 0);

        if (venc > hoje) return false;

        if (cadastro.ultimoPagamento) {
            const ultimoPag = new Date(cadastro.ultimoPagamento);
            ultimoPag.setHours(0, 0, 0, 0);
            if (ultimoPag >= venc) {
                return false;
            }
        }

        return true;
    }

    // ---- LISTAR ALFABETICAMENTE ----
    function renderizarLista() {
        let cadastros = carregarCadastros();
        cadastros = ordenarPorNome(cadastros);

        const busca = document.getElementById('buscaAluno').value.toLowerCase().trim();
        if (busca) {
            cadastros = cadastros.filter(c =>
                c.dadosPessoais.nome.toLowerCase().includes(busca)
            );
        }

        const todos = carregarCadastros();
        const totalAlunos = todos.length;
        const totalReceita = todos.reduce((s, c) => s + Number(c.dadosMatricula.valor || 0), 0);
        const vencidos = todos.filter(c => verificarVencimento(c)).length;
        const receitaLiquida = todos.filter(c => !verificarVencimento(c)).reduce((s, c) => s + Number(c.dadosMatricula.valor || 0), 0);
        const receitaPendente = totalReceita - receitaLiquida;

        document.getElementById('statsArea').innerHTML = `
            <div class="stat-card">
                <div class="stat-num">${totalAlunos}</div>
                <div class="stat-label">Total de Alunos</div>
            </div>
            <div class="stat-card" style="background: linear-gradient(135deg, #27ae60, #1e8449);">
                <div class="stat-num">${formatarValor(receitaLiquida)}</div>
                <div class="stat-label">Receita Líquida</div>
            </div>
            <div class="stat-card" style="background: ${receitaPendente > 0 ? 'linear-gradient(135deg, #e67e22, #d35400)' : 'linear-gradient(135deg, #1a1a2e, #16213e)'}">
                <div class="stat-num">${formatarValor(receitaPendente)}</div>
                <div class="stat-label">Receita Pendente</div>
            </div>
            <div class="stat-card" style="background: ${vencidos > 0 ? 'linear-gradient(135deg, #c0392b, #962d22)' : 'linear-gradient(135deg, #1a1a2e, #16213e)'}">
                <div class="stat-num">${vencidos}</div>
                <div class="stat-label">Vencidas</div>
            </div>
        `;

        const lista = document.getElementById('alunoList');

        if (cadastros.length === 0) {
            lista.innerHTML = `
                <div class="empty-state">
                    <div class="icon">&#128100;</div>
                    <h3>Nenhum aluno encontrado</h3>
                    <p>${busca ? 'Nenhum resultado para "' + busca + '"' : 'Cadastre o primeiro aluno na aba "Novo Cadastro"'}</p>
                </div>`;
            return;
        }

        let html = '';
        cadastros.forEach(c => {
            const letra = c.dadosPessoais.nome.charAt(0).toUpperCase();
            const vencido = verificarVencimento(c);
            html += `
                <li class="aluno-item ${vencido ? 'vencido' : ''}">
                    <div class="aluno-letra">${letra}</div>
                    <div class="aluno-info">
                        <h4>${c.dadosPessoais.nome} ${vencido ? '<span class="status-vencido">Mensalidade Vencida</span>' : ''}</h4>
                        <p>Matrícula: ${c.dadosMatricula.matricula} | Tel: ${c.dadosPessoais.telefone} | Vence: ${formatarDataBR(c.dadosMatricula.vencimento)}${c.ultimoPagamento ? ' | Último pagamento: ' + formatarDataBR(c.ultimoPagamento.split('T')[0]) : ''}</p>
                    </div>
                    <span class="aluno-plano">${c.dadosMatricula.plano}</span>
                    <div class="aluno-actions">
                        <button class="btn-view" onclick="verDetalhes(${c.id})" title="Ver detalhes">&#128065;</button>
                        <button class="btn-edit" onclick="editarAluno(${c.id})" title="Editar">&#9998;</button>
                        <button class="btn-delete" onclick="excluirAluno(${c.id})" title="Excluir">&#128465;</button>
                    </div>
                </li>`;
        });
        lista.innerHTML = html;
    }

    // ---- LISTAR MENSALIDADES VENCIDAS ----
    function renderizarPendentes() {
        let todos = carregarCadastros();
        todos = ordenarPorNome(todos);
        let pendentes = todos.filter(c => verificarVencimento(c));

        const busca = document.getElementById('buscaPendente').value.toLowerCase().trim();
        if (busca) {
            pendentes = pendentes.filter(c =>
                c.dadosPessoais.nome.toLowerCase().includes(busca)
            );
        }

        const totalPendente = pendentes.reduce((s, c) => s + Number(c.dadosMatricula.valor || 0), 0);
        const totalReceita = todos.reduce((s, c) => s + Number(c.dadosMatricula.valor || 0), 0);

        document.getElementById('statsPendentes').innerHTML = `
            <div class="stat-card" style="background: linear-gradient(135deg, #c0392b, #962d22);">
                <div class="stat-num">${pendentes.length}</div>
                <div class="stat-label">Mensalidades Vencidas</div>
            </div>
            <div class="stat-card" style="background: linear-gradient(135deg, #e67e22, #d35400);">
                <div class="stat-num">${formatarValor(totalPendente)}</div>
                <div class="stat-label">Total em Aberto</div>
            </div>
            <div class="stat-card">
                <div class="stat-num">${formatarValor(totalReceita)}</div>
                <div class="stat-label">Receita Total</div>
            </div>
        `;

        const lista = document.getElementById('pendenteList');

        if (pendentes.length === 0) {
            lista.innerHTML = `
                <div class="empty-state">
                    <div class="icon">&#10004;</div>
                    <h3>Nenhuma mensalidade vencida</h3>
                    <p>${busca ? 'Nenhum resultado para "' + busca + '"' : 'Todos os alunos estao em dia!'}</p>
                </div>`;
            return;
        }

        let html = '';
        pendentes.forEach(c => {
            const letra = c.dadosPessoais.nome.charAt(0).toUpperCase();
            html += `
                <li class="aluno-item vencido">
                    <div class="aluno-letra">${letra}</div>
                    <div class="aluno-info">
                        <h4>${c.dadosPessoais.nome} <span class="status-vencido">Vencida</span></h4>
                        <p>Matrícula: ${c.dadosMatricula.matricula} | Tel: ${c.dadosPessoais.telefone} | Vence: ${formatarDataBR(c.dadosMatricula.vencimento)} | Valor: ${formatarValor(c.dadosMatricula.valor)}</p>
                    </div>
                    <span class="aluno-plano">${c.dadosMatricula.plano}</span>
                    <div class="aluno-actions">
                        <button class="btn-view" onclick="verDetalhes(${c.id})" title="Ver detalhes">&#128065;</button>
                        <button class="btn-success" onclick="marcarComoPagoPendente(${c.id})" title="Marcar como Pago">&#10004;</button>
                    </div>
                </li>`;
        });
        lista.innerHTML = html;
    }

    function marcarComoPagoPendente(id) {
        const c = buscarPorId(id);
        if (!c) return;
        if (!confirm('Confirmar pagamento da mensalidade de "' + c.dadosPessoais.nome + '"?')) return;
        let cadastros = carregarCadastros();
        cadastros = cadastros.map(item => {
            if (item.id === id) {
                item.ultimoPagamento = new Date().toISOString();
            }
            return item;
        });
        salvarNoBanco(cadastros);
        alert('Pagamento registrado com sucesso!');
        renderizarPendentes();
    }

    // ---- DETALHES ----
    function verDetalhes(id) {
        const c = buscarPorId(id);
        if (!c) return;
        alunoAtual = c;

        document.getElementById('modalTitle').textContent = c.dadosPessoais.nome;

        const plano = { 'Mensal': 'Mensal', '2 Meses': '2 Meses', '3 Meses': '3 Meses', '6 Meses': '6 Meses' };

        document.getElementById('modalBody').innerHTML = `
            <h3 class="section-title">&#128100; Dados Pessoais</h3>
            <div class="detail-row"><span class="detail-label">Nome</span><span class="detail-value">${c.dadosPessoais.nome}</span></div>
            <div class="detail-row"><span class="detail-label">Data de Nascimento</span><span class="detail-value">${formatarDataBR(c.dadosPessoais.nascimento)}</span></div>
            <div class="detail-row"><span class="detail-label">Sexo</span><span class="detail-value">${c.dadosPessoais.sexo || '-'}</span></div>
            <div class="detail-row"><span class="detail-label">Telefone</span><span class="detail-value">${c.dadosPessoais.telefone}</span></div>
            <div class="detail-row"><span class="detail-label">E-mail</span><span class="detail-value">${c.dadosPessoais.email || '-'}</span></div>

            <h3 class="section-title">&#127891; Dados da Matrícula</h3>
            <div class="detail-row"><span class="detail-label">Matrícula</span><span class="detail-value">${c.dadosMatricula.matricula}</span></div>
            <div class="detail-row"><span class="detail-label">Data da Matrícula</span><span class="detail-value">${formatarDataBR(c.dadosMatricula.dataMatricula)}</span></div>
            <div class="detail-row"><span class="detail-label">Plano</span><span class="detail-value">${plano[c.dadosMatricula.plano] || c.dadosMatricula.plano}</span></div>
            <div class="detail-row"><span class="detail-label">Valor Mensal</span><span class="detail-value">${formatarValor(c.dadosMatricula.valor)}</span></div>
            <div class="detail-row"><span class="detail-label">Vencimento</span><span class="detail-value">${formatarDataBR(c.dadosMatricula.vencimento)}</span></div>
            <div class="detail-row"><span class="detail-label">Pagamento</span><span class="detail-value">${c.dadosMatricula.pagamento}</span></div>
            <div class="detail-row"><span class="detail-label">Último Pagamento</span><span class="detail-value">${c.ultimoPagamento ? formatarDataBR(c.ultimoPagamento.split('T')[0]) : 'Nenhum registro'}</span></div>
            <div class="detail-row"><span class="detail-label">Status</span><span class="detail-value" style="color: ${verificarVencimento(c) ? '#e94560' : '#27ae60'}; font-weight:700;">${verificarVencimento(c) ? 'MENSALIDADE VENCIDA' : 'EM DIA'}</span></div>

            <h3 class="section-title">&#128207; Medidas Corporais</h3>
            <div class="detail-row"><span class="detail-label">Peso</span><span class="detail-value">${c.medidas && c.medidas.peso ? c.medidas.peso + ' kg' : '-'}</span></div>
            <div class="detail-row"><span class="detail-label">Altura</span><span class="detail-value">${c.medidas && c.medidas.altura ? c.medidas.altura + ' cm' : '-'}</span></div>
            <div class="detail-row"><span class="detail-label">Busto</span><span class="detail-value">${c.medidas && c.medidas.busto ? c.medidas.busto + ' cm' : '-'}</span></div>
            <div class="detail-row"><span class="detail-label">Cintura</span><span class="detail-value">${c.medidas && c.medidas.cintura ? c.medidas.cintura + ' cm' : '-'}</span></div>
            <div class="detail-row"><span class="detail-label">Quadril</span><span class="detail-value">${c.medidas && c.medidas.quadril ? c.medidas.quadril + ' cm' : '-'}</span></div>
            <div class="detail-row"><span class="detail-label">Abdômen</span><span class="detail-value">${c.medidas && c.medidas.abdomen ? c.medidas.abdomen + ' cm' : '-'}</span></div>
            <div class="detail-row"><span class="detail-label">Braço D / E</span><span class="detail-value">${c.medidas && c.medidas.bracoD ? c.medidas.bracoD + ' / ' : '- / '}${c.medidas && c.medidas.bracoE ? c.medidas.bracoE : '-'} cm</span></div>
            <div class="detail-row"><span class="detail-label">Coxa D / E</span><span class="detail-value">${c.medidas && c.medidas.coxaD ? c.medidas.coxaD + ' / ' : '- / '}${c.medidas && c.medidas.coxaE ? c.medidas.coxaE : '-'} cm</span></div>
            <div class="detail-row"><span class="detail-label">Panturrilha D / E</span><span class="detail-value">${c.medidas && c.medidas.panturrilhaD ? c.medidas.panturrilhaD + ' / ' : '- / '}${c.medidas && c.medidas.panturrilhaE ? c.medidas.panturrilhaE : '-'} cm</span></div>

            ${c.observacoes ? '<h3 class="section-title">&#128221; Observações</h3><p style="padding:10px;background:#f9f9f9;border-radius:6px;font-size:0.9em;">' + c.observacoes + '</p>' : ''}

            <p style="margin-top:15px;font-size:0.75em;color:#aaa;text-align:right;">Cadastrado em: ${new Date(c.dataCadastro).toLocaleString('pt-BR')}</p>
        `;

        document.getElementById('modalOverlay').classList.add('active');
    }

    function fecharModal(e) {
        if (!e || e.target === document.getElementById('modalOverlay')) {
            document.getElementById('modalOverlay').classList.remove('active');
        }
    }

    function imprimirFicha() {
        window.print();
    }

    // ---- MARCAR COMO PAGO ----
    function marcarComoPago() {
        if (!alunoAtual) return;
        if (!confirm('Confirmar pagamento da mensalidade de "' + alunoAtual.dadosPessoais.nome + '"?')) return;

        let cadastros = carregarCadastros();
        cadastros = cadastros.map(c => {
            if (c.id === alunoAtual.id) {
                c.ultimoPagamento = new Date().toISOString();
            }
            return c;
        });
        salvarNoBanco(cadastros);
        alert('Pagamento registrado com sucesso!');
        fecharModal();
        renderizarLista();
        if (document.getElementById('aba-pendentes').classList.contains('active')) {
            renderizarPendentes();
        }
    }

    // ---- EDITAR ----
    function editarAluno(id) {
        const c = buscarPorId(id);
        if (!c) return;

        editandoId = id;

        document.getElementById('nome').value = c.dadosPessoais.nome || '';
        document.getElementById('nascimento').value = ISOparaDataBR(c.dadosPessoais.nascimento);
        document.getElementById('sexo').value = c.dadosPessoais.sexo || '';
        document.getElementById('telefone').value = c.dadosPessoais.telefone || '';
        document.getElementById('email').value = c.dadosPessoais.email || '';

        document.getElementById('matricula').value = c.dadosMatricula.matricula || '';
        document.getElementById('dataMatricula').value = c.dadosMatricula.dataMatricula || '';
        document.getElementById('plano').value = c.dadosMatricula.plano || '';
        document.getElementById('valor').value = c.dadosMatricula.valor || '';
        document.getElementById('vencimento').value = c.dadosMatricula.vencimento || '';
        document.getElementById('pagamento').value = c.dadosMatricula.pagamento || '';

        const m = c.medidas || {};
        document.getElementById('peso').value = m.peso || '';
        document.getElementById('altura').value = m.altura || '';
        document.getElementById('busto').value = m.busto || '';
        document.getElementById('cintura').value = m.cintura || '';
        document.getElementById('quadril').value = m.quadril || '';
        document.getElementById('bracoD').value = m.bracoD || '';
        document.getElementById('bracoE').value = m.bracoE || '';
        document.getElementById('coxaD').value = m.coxaD || '';
        document.getElementById('coxaE').value = m.coxaE || '';
        document.getElementById('panturrilhaD').value = m.panturrilhaD || '';
        document.getElementById('panturrilhaE').value = m.panturrilhaE || '';
        document.getElementById('abdomen').value = m.abdomen || '';

        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
        document.getElementById('aba-cadastro').classList.add('active');
        document.querySelectorAll('.nav-tab')[0].classList.add('active');
        document.getElementById('btnSalvar').textContent = 'Atualizar Cadastro';

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ---- EXCLUIR ----
    function excluirAluno(id) {
        const c = buscarPorId(id);
        if (!c) return;
        if (!confirm('Excluir o cadastro de "' + c.dadosPessoais.nome + '"?')) return;
        let cadastros = carregarCadastros();
        cadastros = cadastros.filter(c => c.id !== id);
        salvarNoBanco(cadastros);
        renderizarLista();
    }

    // ---- SALVAR ----
    function salvarCadastro() {
        const nome = document.getElementById('nome').value.trim();
        if (!nome) {
            alert('Informe o Nome Completo do aluno antes de salvar.');
            document.getElementById('nome').focus();
            return;
        }

        const cadastro = {
            id: editandoId || Date.now(),
            dadosPessoais: {
                nome: document.getElementById('nome').value.trim(),
                nascimento: document.getElementById('nascimento').value,
                sexo: document.getElementById('sexo').value,
                telefone: document.getElementById('telefone').value,
                email: document.getElementById('email').value
            },
            dadosMatricula: {
                matricula: document.getElementById('matricula').value,
                dataMatricula: document.getElementById('dataMatricula').value,
                plano: document.getElementById('plano').value,
                valor: document.getElementById('valor').value,
                vencimento: document.getElementById('vencimento').value,
                pagamento: document.getElementById('pagamento').value
            },
            medidas: {
                peso: document.getElementById('peso').value,
                altura: document.getElementById('altura').value,
                busto: document.getElementById('busto').value,
                cintura: document.getElementById('cintura').value,
                quadril: document.getElementById('quadril').value,
                bracoD: document.getElementById('bracoD').value,
                bracoE: document.getElementById('bracoE').value,
                coxaD: document.getElementById('coxaD').value,
                coxaE: document.getElementById('coxaE').value,
                panturrilhaD: document.getElementById('panturrilhaD').value,
                panturrilhaE: document.getElementById('panturrilhaE').value,
                abdomen: document.getElementById('abdomen').value
            },
            dataCadastro: new Date().toISOString()
        };

        let cadastros = carregarCadastros();

        if (editandoId !== null) {
            cadastro.dataCadastro = buscarPorId(editandoId).dataCadastro;
            cadastros = cadastros.map(c => c.id === editandoId ? cadastro : c);
            alert('Cadastro atualizado com sucesso!\n\nAluno: ' + cadastro.dadosPessoais.nome);
            editandoId = null;
        } else {
            cadastros.push(cadastro);
            alert('Cadastro salvo com sucesso!\n\nAluno: ' + cadastro.dadosPessoais.nome + '\nMatrícula: ' + cadastro.dadosMatricula.matricula + '\n\nTotal de alunos: ' + cadastros.length);
        }

        cadastros = ordenarPorNome(cadastros);
        salvarNoBanco(cadastros);
        limparFormulario();
    }

    function limparFormulario() {
        document.getElementById('fichaCadastro').reset();
        document.getElementById('dataMatricula').value = dataAtualISO();
        document.getElementById('vencimento').value = dataAtualISO();
        document.getElementById('btnSalvar').textContent = 'Salvar Cadastro';
        editandoId = null;
    }

    // ---- BACKUP / RESTAURAR ----
    function fazerBackup() {
        const cadastros = carregarCadastros();
        if (cadastros.length === 0) {
            alert('Nenhum cadastro para fazer backup.');
            return;
        }
        const dados = JSON.stringify(cadastros, null, 2);
        const blob = new Blob([dados], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'backup-academia-' + dataAtualISO() + '.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        alert('Backup realizado com sucesso!\n\nArquivo: backup-academia-' + dataAtualISO() + '.json\nTotal de cadastros: ' + cadastros.length);
    }

    function restaurarBackup() {
        document.getElementById('inputBackup').click();
    }

    function importarBackup(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const dados = JSON.parse(e.target.result);
                if (!Array.isArray(dados)) {
                    alert('Arquivo de backup invalido.');
                    return;
                }
                if (!confirm('Deseja restaurar o backup?\n\nIsso ira SUBSTITUIR todos os cadastros atuais.\nTotal de cadastros no backup: ' + dados.length)) {
                    return;
                }
                salvarNoBanco(dados);
                alert('Backup restaurado com sucesso!\n\nTotal de cadastros: ' + dados.length);
                renderizarLista();
            } catch (err) {
                alert('Erro ao ler o arquivo de backup.\n\nVerifique se o arquivo esta correto.');
            }
        };
        reader.readAsText(file);
        event.target.value = '';
    }

    limparFormulario();
</script>

</body>
</html>
